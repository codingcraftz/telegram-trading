<!DOCTYPE html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>OWLIM STOCK</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
  </head>
  <body class="bg-background text-foreground">
    <div id="app"></div>
    <script>
      // beforeinstallprompt 캡처 — Vue mount 전에 이벤트 받아둠 (놓치면 prompt 호출 불가).
      // usePwaInstall composable 이 window.__pwaPrompt 를 읽어 "📲 앱 설치" 버튼 활성화.
      window.__pwaPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__pwaPrompt = e;
        window.dispatchEvent(new CustomEvent('owlim:pwa-installable'));
      });
      window.addEventListener('appinstalled', () => {
        window.__pwaPrompt = null;
        window.dispatchEvent(new CustomEvent('owlim:pwa-installed'));
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Service Worker 등록 (PWA 활성화)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((e) => console.warn('SW:', e));
        });
      }
    </script>
  </body>
</html>
