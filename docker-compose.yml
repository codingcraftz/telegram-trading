services:
  bot:
    # GHCR pre-built 이미지. KIS REST를 직접 호출 (별도 MCP 컨테이너 없음).
    image: ghcr.io/codingcraftz/telegram-trading:latest
    container_name: telegram-trading-bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS}
      # KIS keys — 봇이 직접 KIS REST 호출. 모드(MODE)에 따라 paper/real 자동 선택.
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_ACCT_STOCK: ${KIS_ACCT_STOCK:-}
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
      KIS_PAPER_STOCK: ${KIS_PAPER_STOCK:-}
      KIS_PROD_TYPE: ${KIS_PROD_TYPE:-01}
      MODE: ${MODE:-paper}
      MAX_TRADE_KRW: ${MAX_TRADE_KRW:-1000000}
      MAX_OPEN_POSITIONS: ${MAX_OPEN_POSITIONS:-5}
      COOLDOWN_SEC: ${COOLDOWN_SEC:-300}
      DAILY_LOSS_KRW: ${DAILY_LOSS_KRW:-300000}
      INTENT_TTL_MIN: ${INTENT_TTL_MIN:-5}
      DATABASE_FILE: /app/data/tt.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 대시보드 PIN 로그인 — 둘 다 있어야 봇 측 인증 미들웨어가 활성됨.
      # 값 누락 시 (구버전 .env) 미들웨어 skip → Caddy basic_auth 로 fallback (기존 배포 호환).
      DASHBOARD_PIN_HASH: ${DASHBOARD_PIN_HASH:-}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-}
    volumes:
      - ./data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # 자동 업데이트 — 5분마다 GHCR 새 이미지 체크 → 발견 시 pull + bot 재시작.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: telegram-trading-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --label-enable
      - --interval
      - "300"
      - --cleanup
      - --include-restarting

  # Caddy — sslip.io 도메인으로 자동 HTTPS, 봇 대시보드 reverse-proxy.
  caddy:
    image: caddy:2-alpine
    container_name: telegram-trading-caddy
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
